[project]
name = "mb-explainer"
version = "0.1.0"
description = "Companion code for the essay Why AI is mostly a memory problem"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "torch",
    "transformers",
]

[project.scripts]
mb-explainer = "mb_explainer.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
