[project]
name = "ce-explainer"
version = "0.1.0"
description = "Companion code for the essay Why do classifiers train on cross-entropy loss?"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scikit-learn",
]

[project.scripts]
ce-explainer = "ce_explainer.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
