[project]
name = "tiling-explainer"
version = "0.1.0"
description = "Companion code for the essay Tiling a Matrix Multiply on a Mac and an NVIDIA GPU"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx==0.32.4 ; sys_platform == 'darwin'",
    "mlx[cpu]==0.32.4 ; sys_platform == 'linux'",
]

[project.scripts]
tiling-explainer = "tiling_explainer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "modal>=1.6.4",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
gpu = [
    "cupy-cuda12x==13.6.0 ; sys_platform == 'linux'",
]
