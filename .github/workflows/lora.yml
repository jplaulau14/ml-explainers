name: lora

on:
  pull_request:
    paths:
      - "lora/**"
      - ".github/workflows/lora.yml"
  push:
    paths:
      - "lora/**"
      - ".github/workflows/lora.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lora
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
