name: lora

on:
  pull_request:
    paths:
      - "lora/**"
      - ".github/workflows/lora.yml"
  push:
    paths:
      - "lora/**"
      - ".github/workflows/lora.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lora
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - name: Check code limits on changed files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "${BASE//0/}" ]; then BASE=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD); fi
          uv run python scripts/check_limits.py $(git diff --name-only --relative --diff-filter=ACMR "$BASE...HEAD" -- '*.py')
      - run: uv run pytest
